name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      # Browser tests for the <power-strip> component; Firefox and WebKit run locally.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --project=chromium
